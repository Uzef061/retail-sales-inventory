workflows:
  android-apk:
    name: Retail Sales Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - aa
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    working_directory: .
    scripts:
      - name: Set up local.properties
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            if [ -f "mobile_app/pubspec.yaml" ]; then
              cd mobile_app
            elif [ -f "../pubspec.yaml" ]; then
              cd ..
            fi
          fi
          if [ -d "android" ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" > "android/local.properties"
          elif [ -d "mobile_app/android" ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" > "mobile_app/android/local.properties"
          elif [ -n "$CM_BUILD_DIR" ] && [ -d "$CM_BUILD_DIR/mobile_app/android" ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/mobile_app/android/local.properties"
          fi
      - name: Get Flutter packages
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            if [ -f "mobile_app/pubspec.yaml" ]; then
              cd mobile_app
            elif [ -f "../pubspec.yaml" ]; then
              cd ..
            fi
          fi
          flutter pub get
      - name: Run code analysis
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            if [ -f "mobile_app/pubspec.yaml" ]; then
              cd mobile_app
            elif [ -f "../pubspec.yaml" ]; then
              cd ..
            fi
          fi
          flutter analyze
      - name: Run unit tests
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            if [ -f "mobile_app/pubspec.yaml" ]; then
              cd mobile_app
            elif [ -f "../pubspec.yaml" ]; then
              cd ..
            fi
          fi
          flutter test
      - name: Build Android APK
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            if [ -f "mobile_app/pubspec.yaml" ]; then
              cd mobile_app
            elif [ -f "../pubspec.yaml" ]; then
              cd ..
            fi
          fi
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "ERROR: GOOGLE_SERVER_CLIENT_ID environment variable is missing or empty."
            echo "Please configure GOOGLE_SERVER_CLIENT_ID in your Codemagic workflow environment variables."
            exit 1
          fi
          echo "GOOGLE_SERVER_CLIENT_ID is present. Starting release build..."
          flutter build apk --release --no-shrink \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ] && [ -f "mobile_app/build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at: $APK_PATH"
            exit 1
          fi

          echo "Resolving Android signing inspection tool (apksigner / keytool)..."
          APKSIGNER_BIN=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="apksigner"
          else
            for dir in "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_HOME/build-tools" "$HOME/Library/Android/sdk/build-tools" /opt/android-sdk/build-tools; do
              if [ -d "$dir" ]; then
                CANDIDATE=$(find "$dir" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
                if [ -n "$CANDIDATE" ] && [ -x "$CANDIDATE" ]; then
                  APKSIGNER_BIN="$CANDIDATE"
                  break
                fi
              fi
            done
          fi

          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Inspecting APK signing certificate with apksigner ($APKSIGNER_BIN)..."
            CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs "$APK_PATH" 2>&1)
            VERIFY_STATUS=$?
          elif command -v keytool >/dev/null 2>&1; then
            echo "apksigner not found; attempting with keytool..."
            CERT_INFO=$(keytool -printcert -jarfile "$APK_PATH" 2>&1)
            VERIFY_STATUS=$?
          else
            echo "ERROR: Neither 'apksigner' nor 'keytool' is available in PATH or Android SDK directories."
            exit 1
          fi

          if [ $VERIFY_STATUS -ne 0 ] || [ -z "$CERT_INFO" ]; then
            echo "ERROR: Certificate inspection failed with exit status $VERIFY_STATUS."
            echo "Diagnostic tool output:"
            echo "$CERT_INFO"
            exit 1
          fi

          RAW_SHA1=$(echo "$CERT_INFO" | grep -E -i "(SHA-1 digest|SHA1:)" | head -n 1)
          if [ -z "$RAW_SHA1" ]; then
            echo "ERROR: SHA-1 fingerprint line not found in certificate output."
            echo "Diagnostic tool output:"
            echo "$CERT_INFO"
            exit 1
          fi

          # Extract raw hex string
          HEX_VAL=$(echo "$RAW_SHA1" | awk -F': ' '{print $NF}' | tr -d ' ' | tr '[:lower:]' '[:upper:]')

          # Format with colons if unformatted (apksigner outputs lowercase hex without colons)
          if echo "$HEX_VAL" | grep -q ":"; then
            FORMATTED_SHA1="$HEX_VAL"
          else
            FORMATTED_SHA1=$(echo "$HEX_VAL" | awk '{gsub(/../, "&:"); sub(/:$/, ""); print}')
          fi

          echo "=========================================================="
          echo "APK SIGNING CERTIFICATE DETAILS:"
          echo "$CERT_INFO" | grep -E -i "(certificate DN|Owner:|Issuer:)" || true
          echo ""
          echo "RAW EXTRACTED LINE:"
          echo "  $RAW_SHA1"
          echo ""
          echo "GOOGLE CLOUD CONSOLE FORMAT (WITH COLONS):"
          echo "  $FORMATTED_SHA1"
          echo "=========================================================="
    artifacts:
      - mobile_app/build/**/outputs/**/*.apk
      - build/**/outputs/**/*.apk
