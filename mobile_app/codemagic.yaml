workflows:
  android-apk:
    name: Retail Sales Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups: []
    working_directory: mobile_app
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/mobile_app/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run code analysis
        script: |
          flutter analyze
      - name: Run unit tests
        script: |
          flutter test
      - name: Build Android APK
        script: |
          flutter build apk --release --no-shrink
    artifacts:
      - mobile_app/build/**/outputs/**/*.apk
      - build/**/outputs/**/*.apk
